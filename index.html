<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/main.js"></script>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <script defer src="js/ie.js"></script>
    <script src="https://kit.fontawesome.com/a3a81aa534.js" crossorigin="anonymous"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@400..900&family=Poiret+One&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="cardWrap">

        <article class="card" id="card">

            <div class="front">
                <img src="img/profile_woman_1.jpg" alt="프로필 이미지">
                <div class="profile">
                    <div class="name">
                        <h1>Sophie Bennett</h1>
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <p>Product Designer who focuses on simplicity & usability.</p>
                </div>

                <div class="info">
                    <div class="item">
                        <i class="far fa-user"></i>
                        <span>312</span>
                    </div>
                    <div class="item">
                        <i class="far fa-images"></i>
                        <span>48</span>
                    </div>
                    <a href="#" class="btnFollow">Follow +</a>
                </div>
            </div>

            <div class="back">

                <img src="img/profile_woman_1.jpg" alt="프로필 이미지">

                <div class="overlay">

                    <div class="profile">
                        <div class="name">
                            <h1>Sophie Bennett</h1>
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <p>Product Designer who focuses on simplicity & usability.</p>
                    </div>

                    <div class="info">
                        <div class="item">
                            <i class="far fa-user"></i>
                            <span>312</span>
                        </div>
                        <div class="item">
                            <i class="far fa-images"></i>
                            <span>48</span>
                        </div>
                        <a href="#" class="btnFollow">Follow +</a>
                    </div>

                </div>

            </div>

        </article>
        <div class="flipText">Click Card</div>
    </div>

</body>

</html>
